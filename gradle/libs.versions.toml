[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
paging = "3.5.3"
coil = "3.6.3"
work = "2.12.0"
coroutines = "1.11.0"
serialization = "1.12.0"
jna = "5.19.1"
robolectric = "4.17"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# Mindestversionen gegen bekannte Sicherheitslücken in Build-Werkzeugen (siehe build.gradle.kts)
secBouncycastle = "1.86"
secGuava = "33.7.2-jre"
secJose4j = "0.9.7"
secJdom2 = "2.0.6.1"
secLogback = "1.5.34"
secCommonsLang3 = "3.21.0"
secHttpclient = "4.5.14"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Nur Constraints für Build-Werkzeuge (Plugin-Classpath, Lint, ktlint); keine App-Abhängigkeiten
sec-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "secBouncycastle" }
sec-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "secBouncycastle" }
sec-guava = { module = "com.google.guava:guava", version.ref = "secGuava" }
sec-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "secJose4j" }
sec-jdom2 = { module = "org.jdom:jdom2", version.ref = "secJdom2" }
sec-logback-core = { module = "ch.qos.logback:logback-core", version.ref = "secLogback" }
sec-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "secLogback" }
sec-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "secCommonsLang3" }
sec-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "secHttpclient" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
