[package]
name = "crunchymate-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "crunchymate_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# Nur für das Host-Bindgen-Binary, damit die Android-Bibliothek ohne CLI-Code baut
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32.2" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
