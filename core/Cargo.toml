[package]
name = "crunchymate-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "crunchymate_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# Nur für das Host-Bindgen-Binary, damit die Android-Bibliothek ohne CLI-Code baut
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32.2", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
async-trait = "0.1.92"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1.0.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Nur JPEG/PNG dekodieren; WebP-Quellen werden unverändert gespeichert
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Verlustbehaftetes WebP mit Qualitätsstufe gibt es nur über libwebp (per cc gebaut)
webp = { version = "0.3.1", default-features = false }
sha2 = "0.11.1"

[dev-dependencies]
wiremock = "0.6.5"
