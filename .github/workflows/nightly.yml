name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    name: Bauen oder überspringen
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD)" != "$(git rev-list -n1 nightly)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "HEAD entspricht dem Tag nightly, nichts zu bauen."
          fi

  checks:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    uses: ./.github/workflows/checks.yml

  release:
    name: Signierte APK veröffentlichen
    needs: [decide, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Plattform, Build-Tools und NDK installieren
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore dekodieren
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Release-APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(grep '^crunchymate.baseVersion=' gradle.properties | cut -d= -f2)
          version="${base}-nightly.$(date -u +%Y%m%d)+$(git rev-parse --short HEAD)"
          echo "Version: $version"
          ./gradlew assembleRelease \
            "-Pcrunchymate.versionCode=$RUN_NUMBER" \
            "-Pcrunchymate.versionName=$version"
          ls app/build/outputs/apk/release/
      - name: Release-Notizen erzeugen
        run: |
          if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            git log --oneline "nightly..HEAD" > notes.md
          else
            git log --oneline -n 20 > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Keine neuen Commits." > notes.md
          fi
      - name: Pre-Release nightly ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md \
            app/build/outputs/apk/release/app-release.apk
      - name: Keystore löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
