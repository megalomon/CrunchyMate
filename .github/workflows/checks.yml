name: Checks

on:
  workflow_call:
    inputs:
      # Leer: Standard-Ref des auslösenden Ereignisses; der Release-Workflow prüft damit das Tag
      ref:
        description: Zu prüfender Git-Ref
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust-Kern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-android-build
      # assembleRelease ohne Signierung fängt R8-Fehler vor dem Nightly ab
      - run: ./gradlew lint ktlintCheck testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
