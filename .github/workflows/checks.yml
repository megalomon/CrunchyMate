name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust-Kern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
      - name: SDK-Lizenzen akzeptieren
        # yes endet beim Schließen der Pipe mit SIGPIPE; unter pipefail darf das nicht scheitern.
        run: "{ yes || true; } | sdkmanager --licenses > /dev/null"
      - name: Plattform, Build-Tools und NDK installieren
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease ohne Signierung fängt R8-Fehler vor dem Nightly ab
      - run: ./gradlew lint ktlintCheck testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
